---
- name: Upgrade LayerSentry Single-OS provider within confirmed release line
  hosts: layersentry_single_os
  gather_facts: true
  become: false
  any_errors_fatal: true
  vars:
    layersentry_role_map:
      postgresql: postgresql
      mysql: mysql_family
      mariadb: mysql_family
      redis: keyvalue
      valkey: keyvalue
      nginx: nginx
      apache-httpd: httpd
      tomcat: tomcat
      nodejs-runtime: nodejs
      python-runtime: runtime
      podman-runtime: runtime
  tasks:
    - name: Require immutable upgrade invocation
      ansible.builtin.assert:
        that:
          - layersentry_action == 'upgrade'
          - layersentry_provider in layersentry_role_map
          - layersentry_plan_digest | length == 64
          - layersentry_request.topology == 'standalone'
          - layersentry_operation_id == layersentry_request.operation_id
          - layersentry_service_id == layersentry_request.service_id
        fail_msg: Invalid Single-OS upgrade invocation.

    - name: Decode transient PostgreSQL secret in memory only
      ansible.builtin.set_fact:
        layersentry_secrets:
          admin_password: "{{ layersentry_secrets_b64.admin_password | b64decode }}"
      when: layersentry_provider == 'postgresql'
      no_log: true

    - name: Validate Rocky Linux and security baseline
      ansible.builtin.include_role:
        name: rocky9_base

    - name: Observe and remount existing storage without destructive replay
      ansible.builtin.include_role:
        name: storage_lvm
      vars:
        layersentry_recovery_only: true

    - name: Verify PostgreSQL cluster identity exists before upgrade
      ansible.builtin.stat:
        path: "{{ ((layersentry_paths['database-data'] ~ '/data') if (layersentry_paths['database-data'] | default('')) else ('/var/lib/pgsql/' ~ layersentry_request.release_line ~ '/data')) ~ '/PG_VERSION' }}"
      register: layersentry_upgrade_pg_identity
      when: layersentry_provider == 'postgresql'

    - name: Refuse PostgreSQL upgrade when cluster identity is missing
      ansible.builtin.assert:
        that: [layersentry_upgrade_pg_identity.stat.exists]
        fail_msg: PostgreSQL upgrade cannot initialize a missing data cluster.
      when: layersentry_provider == 'postgresql'

    - name: Verify MySQL-family system database exists before upgrade
      ansible.builtin.stat:
        path: "{{ ((layersentry_paths['database-data'] ~ '/data') if (layersentry_paths['database-data'] | default('')) else '/var/lib/mysql') ~ '/mysql' }}"
      register: layersentry_upgrade_mysql_identity
      when: layersentry_provider in ['mysql', 'mariadb']

    - name: Refuse MySQL-family upgrade when system database is missing
      ansible.builtin.assert:
        that: [layersentry_upgrade_mysql_identity.stat.exists]
        fail_msg: Database upgrade cannot initialize a missing system database.
      when: layersentry_provider in ['mysql', 'mariadb']

    - name: Install exact upgraded package and reconcile configuration
      ansible.builtin.include_role:
        name: "{{ layersentry_role_map[layersentry_provider] }}"

    - name: Reconcile firewall and optional VIP
      ansible.builtin.include_role:
        name: network_vip
      vars:
        layersentry_network_state: present

    - name: Flush network handlers
      ansible.builtin.meta: flush_handlers

    - name: Restart provider service after same-line upgrade
      ansible.builtin.systemd_service:
        name: "{{ layersentry_service_unit }}"
        enabled: true
        state: restarted
      when: layersentry_service_unit | length > 0

    - name: Reconcile MySQL-family managed administrator after upgrade
      layersentry_mysql_bootstrap:
        provider: "{{ layersentry_provider }}"
        password_b64: "{{ layersentry_secrets_b64.admin_password }}"
      when: layersentry_provider in ['mysql', 'mariadb']
      no_log: true
