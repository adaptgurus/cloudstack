---
- name: Apply confirmed LayerSentry Single-OS service plan
  hosts: layersentry_single_os
  gather_facts: true
  become: false
  any_errors_fatal: true
  vars:
    layersentry_role_map:
      postgresql: postgresql
      mysql: mysql_family
      mariadb: mysql_family
      redis: keyvalue
      valkey: keyvalue
      nginx: nginx
      apache-httpd: httpd
      tomcat: tomcat
      nodejs-runtime: nodejs
      python-runtime: runtime
      podman-runtime: runtime
  tasks:
    - name: Require immutable allowlisted apply invocation
      ansible.builtin.assert:
        that:
          - layersentry_action == 'apply'
          - layersentry_provider in layersentry_role_map
          - layersentry_plan_digest | length == 64
          - (layersentry_operation_id == layersentry_request.operation_id) or ((layersentry_recovery_of_operation_id | default('')) == layersentry_request.operation_id)
          - layersentry_service_id == layersentry_request.service_id
          - layersentry_request.topology == 'standalone'
        fail_msg: Invalid, unsupported or mismatched LayerSentry apply invocation.

    - name: Decode transient PostgreSQL secret in memory only
      ansible.builtin.set_fact:
        layersentry_secrets:
          admin_password: "{{ layersentry_secrets_b64.admin_password | b64decode }}"
      when: layersentry_provider == 'postgresql'
      no_log: true

    - name: Validate Rocky Linux and security baseline
      ansible.builtin.include_role:
        name: rocky9_base

    - name: Reconcile confirmed storage before provider initialization
      ansible.builtin.include_role:
        name: storage_lvm
      vars:
        layersentry_recovery_only: false

    - name: Install configure and initialize selected provider without starting it
      ansible.builtin.include_role:
        name: "{{ layersentry_role_map[layersentry_provider] }}"

    - name: Apply client firewall and optional VIP before service start
      ansible.builtin.include_role:
        name: network_vip
      vars:
        layersentry_network_state: present

    - name: Flush network and VIP handlers before service start
      ansible.builtin.meta: flush_handlers

    - name: Enable and start provider service after firewall and VIP are ready
      ansible.builtin.systemd_service:
        name: "{{ layersentry_service_unit }}"
        enabled: true
        state: started
      when: layersentry_service_unit | length > 0

    - name: Bootstrap MySQL-family managed administrator after local service start
      layersentry_mysql_bootstrap:
        provider: "{{ layersentry_provider }}"
        password_b64: "{{ layersentry_secrets_b64.admin_password }}"
      when: layersentry_provider in ['mysql', 'mariadb']
      no_log: true
