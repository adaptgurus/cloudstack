---
- name: Repair LayerSentry Single-OS PostgreSQL without destructive replay
  hosts: layersentry_single_os
  gather_facts: true
  become: false
  any_errors_fatal: true
  tasks:
    - name: Require repair invocation
      ansible.builtin.assert:
        that:
          - layersentry_action == 'repair'
          - layersentry_provider == 'postgresql'
          - layersentry_request.topology == 'standalone'
        fail_msg: Invalid PostgreSQL repair invocation.

    - name: Decode transient provider secrets in memory only
      ansible.builtin.set_fact:
        layersentry_secrets:
          admin_password: "{{ layersentry_secrets_b64.admin_password | b64decode }}"
      no_log: true

    - name: Validate Rocky Linux and security baseline
      ansible.builtin.include_role:
        name: rocky9_base

    - name: Observe existing storage and restore mounts only
      ansible.builtin.include_role:
        name: storage_lvm
      vars:
        layersentry_recovery_only: true

    - name: Reconcile PostgreSQL package and configuration
      ansible.builtin.include_role:
        name: postgresql

    - name: Reconcile firewall and optional VIP
      ansible.builtin.include_role:
        name: network_vip
      vars:
        layersentry_network_state: present

    - name: Flush network handlers
      ansible.builtin.meta: flush_handlers

    - name: Restart PostgreSQL after repair
      ansible.builtin.systemd_service:
        name: "postgresql-{{ layersentry_request.release_line }}.service"
        enabled: true
        state: restarted
