---
- name: Derive service firewall zone
  ansible.builtin.set_fact:
    layersentry_firewall_zone: "ls-svc-{{ (layersentry_service_id | replace('-', ''))[:8] }}"
    layersentry_network_state: "{{ layersentry_network_state | default('present') }}"

- name: Read permanent firewalld zones
  ansible.builtin.command:
    argv: [/usr/bin/firewall-cmd, --permanent, --get-zones]
  register: layersentry_firewalld_zones
  changed_when: false
  when: layersentry_request.network.port | int > 0

- name: Create LayerSentry service firewall zone
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-cmd
      - --permanent
      - "--new-zone={{ layersentry_firewall_zone }}"
  when:
    - layersentry_request.network.port | int > 0
    - layersentry_network_state == 'present'
    - layersentry_firewall_zone not in layersentry_firewalld_zones.stdout.split()
  notify: reload firewalld

- name: Set service firewall zone default drop target
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-cmd
      - --permanent
      - "--zone={{ layersentry_firewall_zone }}"
      - --set-target=DROP
  register: layersentry_zone_target
  changed_when: "'success' in (layersentry_zone_target.stdout | lower)"
  when:
    - layersentry_request.network.port | int > 0
    - layersentry_network_state == 'present'

- name: Add explicit client CIDRs to service firewall zone
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-cmd
      - --permanent
      - "--zone={{ layersentry_firewall_zone }}"
      - "--add-source={{ item }}"
  loop: "{{ layersentry_request.network.allowed_cidrs | default([]) }}"
  register: layersentry_firewall_sources
  changed_when: "'success' in (layersentry_firewall_sources.stdout | default('') | lower)"
  when:
    - layersentry_request.network.port | int > 0
    - layersentry_network_state == 'present'
  notify: reload firewalld

- name: Add provider TCP port to service firewall zone
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-cmd
      - --permanent
      - "--zone={{ layersentry_firewall_zone }}"
      - "--add-port={{ layersentry_request.network.port }}/tcp"
  register: layersentry_firewall_port
  changed_when: "'success' in (layersentry_firewall_port.stdout | lower)"
  when:
    - layersentry_request.network.port | int > 0
    - layersentry_network_state == 'present'
  notify: reload firewalld

- name: Check nm-cloud-setup before static secondary VIP
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, is-active, nm-cloud-setup.service]
  register: layersentry_nm_cloud_setup
  failed_when: false
  changed_when: false
  when:
    - layersentry_network_state == 'present'
    - layersentry_request.network.vip.mode | default('') == 'secondary'

- name: Refuse secondary VIP while nm-cloud-setup is active
  ansible.builtin.assert:
    that:
      - layersentry_nm_cloud_setup.rc != 0
    fail_msg: nm-cloud-setup.service is active; refusing a persistent manual secondary VIP that metadata reconciliation could remove.
  when:
    - layersentry_network_state == 'present'
    - layersentry_request.network.vip.mode | default('') == 'secondary'

- name: Resolve active NetworkManager connection for secondary VIP
  ansible.builtin.command:
    argv:
      - /usr/bin/nmcli
      - -g
      - GENERAL.CONNECTION
      - device
      - show
      - "{{ layersentry_request.network.vip.interface }}"
  register: layersentry_nm_connection
  changed_when: false
  when:
    - layersentry_network_state == 'present'
    - layersentry_request.network.vip.mode | default('') == 'secondary'

- name: Read existing connection IPv4 addresses
  ansible.builtin.command:
    argv:
      - /usr/bin/nmcli
      - -g
      - ipv4.addresses
      - connection
      - show
      - "{{ layersentry_nm_connection.stdout | trim }}"
  register: layersentry_nm_addresses
  changed_when: false
  when:
    - layersentry_network_state == 'present'
    - layersentry_request.network.vip.mode | default('') == 'secondary'

- name: Persist secondary VIP on the active connection
  ansible.builtin.command:
    argv:
      - /usr/bin/nmcli
      - connection
      - modify
      - "{{ layersentry_nm_connection.stdout | trim }}"
      - +ipv4.addresses
      - "{{ layersentry_request.network.vip.address }}/{{ layersentry_request.network.vip.prefix_length }}"
  when:
    - layersentry_network_state == 'present'
    - layersentry_request.network.vip.mode | default('') == 'secondary'
    - (layersentry_request.network.vip.address ~ '/' ~ (layersentry_request.network.vip.prefix_length | string)) not in (layersentry_nm_addresses.stdout | default(''))
  notify: reapply secondary VIP

- name: Require immutable Keepalived pin for VRRP
  ansible.builtin.assert:
    that:
      - layersentry_vrrp_keepalived_nevra | default('') | length > 0
      - layersentry_vrrp_keepalived_repo | default('') == 'appstream'
    fail_msg: VRRP requires an exact Keepalived NEVRA pinned by the immutable Go plan.
  when:
    - layersentry_network_state == 'present'
    - layersentry_request.network.vip.mode | default('') == 'vrrp'

- name: Install exact Keepalived package for VRRP
  ansible.builtin.dnf:
    name: "{{ layersentry_vrrp_keepalived_nevra }}"
    state: present
    install_weak_deps: false
    disablerepo: '*'
    enablerepo: "{{ layersentry_vrrp_keepalived_repo }}"
    disable_gpg_check: false
  when:
    - layersentry_network_state == 'present'
    - layersentry_request.network.vip.mode | default('') == 'vrrp'

- name: Install deterministic Keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0600'
  when:
    - layersentry_network_state == 'present'
    - layersentry_request.network.vip.mode | default('') == 'vrrp'
  notify: restart keepalived

- name: Add VRRP protocol only from declared peers
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-cmd
      - --permanent
      - "--zone={{ layersentry_firewall_zone }}"
      - "--add-rich-rule=rule family=ipv4 source address={{ item }}/32 protocol value=vrrp accept"
  loop: "{{ layersentry_request.network.vip.peers | default([]) }}"
  register: layersentry_vrrp_rules
  changed_when: "'success' in (layersentry_vrrp_rules.stdout | default('') | lower)"
  when:
    - layersentry_network_state == 'present'
    - layersentry_request.network.vip.mode | default('') == 'vrrp'
  notify: reload firewalld

- name: Enable Keepalived for VRRP
  ansible.builtin.systemd_service:
    name: keepalived.service
    enabled: true
    state: started
  when:
    - layersentry_network_state == 'present'
    - layersentry_request.network.vip.mode | default('') == 'vrrp'

- name: Stop Keepalived during VRRP removal
  ansible.builtin.systemd_service:
    name: keepalived.service
    enabled: false
    state: stopped
  failed_when: false
  when:
    - layersentry_network_state == 'absent'
    - layersentry_request.network.vip.mode | default('') == 'vrrp'

- name: Remove secondary VIP during uninstall
  ansible.builtin.command:
    argv:
      - /usr/bin/nmcli
      - connection
      - modify
      - "{{ layersentry_nm_connection.stdout | trim }}"
      - -ipv4.addresses
      - "{{ layersentry_request.network.vip.address }}/{{ layersentry_request.network.vip.prefix_length }}"
  failed_when: false
  when:
    - layersentry_network_state == 'absent'
    - layersentry_request.network.vip.mode | default('') == 'secondary'
    - layersentry_nm_connection is defined
  notify: reapply secondary VIP

- name: Remove LayerSentry service firewall zone
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-cmd
      - --permanent
      - "--delete-zone={{ layersentry_firewall_zone }}"
  register: layersentry_firewall_remove
  failed_when: false
  changed_when: layersentry_firewall_remove.rc == 0
  when:
    - layersentry_network_state == 'absent'
    - layersentry_request.network.port | int > 0
  notify: reload firewalld
