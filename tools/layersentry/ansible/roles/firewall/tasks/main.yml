---
- name: Validate hypervisor firewall intent
  ansible.builtin.assert:
    that:
      - layersentry_hypervisor_firewall is mapping
      - layersentry_hypervisor_firewall.zone is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$')
      - layersentry_hypervisor_firewall.agent_port | int == 8250
      - layersentry_hypervisor_firewall.management_cidrs is sequence
      - layersentry_hypervisor_firewall.management_cidrs | length > 0
      - item is match('^[0-9A-Fa-f:.]+/[0-9]{1,3}$')
    fail_msg: Hypervisor firewalld intent is invalid for the certified CloudStack-agent profile.
  loop: "{{ layersentry_hypervisor_firewall.management_cidrs }}"
  loop_control:
    label: "{{ item | default('invalid') }}"

- name: Discover management bridge firewalld zone
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-cmd
      - "--get-zone-of-interface={{ layersentry_management_bridge }}"
  register: layersentry_management_firewall_zone
  changed_when: false
  failed_when: layersentry_management_firewall_zone.rc != 0

- name: Require management bridge to remain in the intended existing zone
  ansible.builtin.assert:
    that:
      - layersentry_management_firewall_zone.stdout | trim == layersentry_hypervisor_firewall.zone
    fail_msg: Management bridge firewalld zone does not match signed intent; LayerSentry will not reassign it implicitly.

- name: Query permanent CloudStack-agent allow rules
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-cmd
      - --permanent
      - "--zone={{ layersentry_hypervisor_firewall.zone }}"
      - "--query-rich-rule=rule family=\"{{ 'ipv6' if ':' in item else 'ipv4' }}\" source address=\"{{ item }}\" port port=\"{{ layersentry_hypervisor_firewall.agent_port | int }}\" protocol=\"tcp\" accept"
  register: layersentry_firewall_rule_queries
  changed_when: false
  failed_when: layersentry_firewall_rule_queries.rc not in [0, 1]
  loop: "{{ layersentry_hypervisor_firewall.management_cidrs }}"
  loop_control:
    label: "{{ item }}"

- name: Add missing permanent CloudStack-agent allow rules
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-cmd
      - --permanent
      - "--zone={{ layersentry_hypervisor_firewall.zone }}"
      - "--add-rich-rule=rule family=\"{{ 'ipv6' if ':' in item.item else 'ipv4' }}\" source address=\"{{ item.item }}\" port port=\"{{ layersentry_hypervisor_firewall.agent_port | int }}\" protocol=\"tcp\" accept"
  register: layersentry_firewall_rule_adds
  when: item.rc == 1
  loop: "{{ layersentry_firewall_rule_queries.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Reload firewalld when permanent rules changed
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-cmd
      - --reload
  when: layersentry_firewall_rule_adds.changed | default(false)
  changed_when: true

- name: Verify runtime CloudStack-agent allow rules
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-cmd
      - "--zone={{ layersentry_hypervisor_firewall.zone }}"
      - "--query-rich-rule=rule family=\"{{ 'ipv6' if ':' in item else 'ipv4' }}\" source address=\"{{ item }}\" port port=\"{{ layersentry_hypervisor_firewall.agent_port | int }}\" protocol=\"tcp\" accept"
  register: layersentry_firewall_runtime_rules
  changed_when: false
  failed_when: layersentry_firewall_runtime_rules.rc != 0
  loop: "{{ layersentry_hypervisor_firewall.management_cidrs }}"
  loop_control:
    label: "{{ item }}"
