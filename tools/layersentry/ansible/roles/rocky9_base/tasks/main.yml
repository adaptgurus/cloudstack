---
- name: Require Rocky Linux 9
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Rocky'
      - ansible_facts.distribution_major_version == '9'
    fail_msg: LayerSentry Single-OS requires Rocky Linux 9.

- name: Read SELinux enforcement state
  ansible.builtin.command:
    argv: [/usr/sbin/getenforce]
  register: layersentry_getenforce
  changed_when: false

- name: Require SELinux enforcing
  ansible.builtin.assert:
    that:
      - layersentry_getenforce.stdout | trim == 'Enforcing'
    fail_msg: SELinux must remain Enforcing.

- name: Ensure required base execution packages are present
  ansible.builtin.dnf:
    name:
      - firewalld
      - lvm2
      - xfsprogs
      - e2fsprogs
      - policycoreutils-python-utils
      - NetworkManager
      - util-linux
    state: present
    install_weak_deps: false

- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd_service:
    name: firewalld.service
    enabled: true
    state: started

- name: Ensure NetworkManager is enabled and running
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    enabled: true
    state: started
