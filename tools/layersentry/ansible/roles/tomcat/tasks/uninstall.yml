---
- name: Refuse destructive Tomcat uninstall through normal lifecycle
  ansible.builtin.assert:
    that:
      - not (layersentry_destroy_data | default(false) | bool)
    fail_msg: Tomcat uninstall never destroys deployed application data.

- name: Restore original Tomcat Connector and Host attributes
  layersentry_tomcat_config:
    service_id: "{{ layersentry_service_id }}"
    address: "{{ layersentry_request.network.listen_address }}"
    port: "{{ layersentry_request.network.port | int }}"
    app_base: "{{ (layersentry_paths['application-data'] ~ '/webapps') if (layersentry_paths['application-data'] | default('')) else '' }}"
    state: absent

- name: Remove legacy Tomcat ownership and appBase backup markers if present
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/layersentryd/state/tomcat-owner
    - /var/lib/layersentryd/state/tomcat-appbase.json
    - /var/lib/layersentryd/state/tomcat-original-connector.json

- name: Remove Tomcat package while preserving application content
  ansible.builtin.dnf:
    name: tomcat
    state: absent
