# Include inside the existing LayerSentry TLS server block.
# The nginx worker must have access to the restricted BFF socket group.
location ^~ /client/layersentry-k8s/v1/kubernetes/ {
    proxy_pass http://unix:/run/layersentry-k8s/bff.sock:/v1/kubernetes/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    # Identity comes only from the validated CloudStack session, never these headers.
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Account-Id "";
    proxy_set_header X-Domain-Id "";
    proxy_set_header X-Project-Id "";
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_timeout 15s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 20s;
    proxy_read_timeout 55s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_intercept_errors off;
    access_log off;
}
# Never let an unknown module route fall back to the CloudStack SPA shell.
location /client/layersentry-k8s/ {
    default_type application/json;
    return 404 '{"error":"Unknown Kubernetes API route"}';
}
