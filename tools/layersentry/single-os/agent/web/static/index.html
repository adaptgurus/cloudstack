<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LayerSentry Single-OS</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#18212f}header{padding:18px 28px;background:#111827;color:#fff}.wrap{max-width:1100px;margin:28px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:18px}label{display:block;font-weight:600;margin-top:12px}input,select,textarea,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #cbd5e1}input,select,textarea{width:100%;box-sizing:border-box}button{margin-top:14px;background:#111827;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto}.muted{color:#64748b}.danger{color:#b91c1c;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>LayerSentry Single-OS DBaaS/APaaS</strong></header><main class="wrap"><section class="card"><h2>Appliance</h2><div id="status" class="muted">Connecting…</div></section><section class="card"><h2>Create service plan</h2><div class="grid"><div><label>Category</label><select id="category"><option value="database">Database</option><option value="application">Application Platform</option></select></div><div><label>Provider</label><select id="provider"><option value="postgresql">PostgreSQL</option><option value="nginx">Nginx</option></select></div><div><label>Release line</label><input id="release" value="17"></div><div><label>Topology</label><select id="topology"><option value="standalone">Standalone</option><option value="cluster">Cluster</option></select></div><div><label>Listen IP</label><input id="ip" placeholder="10.10.10.20"></div><div><label>Port</label><input id="port" type="number" value="5432"></div></div><label>Allowed CIDRs (comma separated)</label><input id="cidrs" placeholder="10.10.20.0/24"><button id="plan">Validate and generate immutable plan</button><pre id="result">No plan generated.</pre><div class="danger">Installation is never started by generating a plan. Review the complete plan and confirm its digest through the install action.</div></section></main><script>const $=id=>document.getElementById(id);async function api(path,opt={}){opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});const r=await fetch(path,opt);const t=await r.text();let body;try{body=JSON.parse(t)}catch{body=t}if(!r.ok)throw new Error(typeof body==='string'?body:JSON.stringify(body));return body}api('/api/v1/health').then(x=>$('status').textContent='Agent online: '+JSON.stringify(x)).catch(e=>$('status').textContent='Authentication/bootstrap required: '+e.message);$('plan').onclick=async()=>{const uuid=crypto.randomUUID();const req={schema_version:1,request_id:crypto.randomUUID(),service_id:crypto.randomUUID(),operation_id:uuid,idempotency_key:crypto.randomUUID(),category:$('category').value,provider:$('provider').value,release_line:$('release').value,topology:$('topology').value,storage:[],network:{listen_address:$('ip').value,port:Number($('port').value),allowed_cidrs:$('cidrs').value.split(',').map(x=>x.trim()).filter(Boolean)},maintenance:{mode:'manual',auto_patch:false,release_line_locked:true},backup:{enabled:false},cluster:{role:$('topology').value==='cluster'?'primary':''},secret_refs:{}};try{$('result').textContent=JSON.stringify(await api('/api/v1/plans',{method:'POST',body:JSON.stringify(req)}),null,2)}catch(e){$('result').textContent=e.message}};</script></body></html>
