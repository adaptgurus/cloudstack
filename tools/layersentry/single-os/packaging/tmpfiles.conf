d /var/lib/layersentryd 0700 layersentry layersentry -
d /var/lib/layersentryd/identity 0700 layersentry layersentry -
d /var/lib/layersentryd/state 0700 layersentry layersentry -
d /var/lib/layersentryd/state/services 0700 layersentry layersentry -
d /var/lib/layersentryd/operations 0700 layersentry layersentry -
d /var/lib/layersentryd/plans 0700 layersentry layersentry -
d /var/lib/layersentryd/checkpoints 0700 layersentry layersentry -
d /var/lib/layersentryd/secrets 0700 layersentry layersentry -
d /var/lib/layersentryd/evidence 0700 layersentry layersentry -
# Execute-only traversal permits a provider account to reach its own 0700 backup
# directory without making the backup root listable to other local users.
d /var/lib/layersentryd/backups 0711 layersentry layersentry -
# Sticky group-writable runtime directory: layersentry may create transient files,
# but cannot remove the root-owned privileged helper socket.
d /run/layersentryd 1770 root layersentry -
