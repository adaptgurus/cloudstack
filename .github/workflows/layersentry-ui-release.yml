name: LayerSentry UI release candidate

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Immutable LayerSentry release version
        required: true
        type: string
  push:
    branches:
      - layersentry/4.22.1.1-ui
    paths:
      - .github/workflows/layersentry-ui-release.yml
      - ui/**
      - tools/layersentry-release/**

permissions:
  contents: read

jobs:
  build-unsigned-candidate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Capture pinned builder versions
        run: |
          echo "LAYERSENTRY_NODE_VERSION=$(node --version | sed 's/^v//')" >> "$GITHUB_ENV"
          echo "LAYERSENTRY_NPM_VERSION=$(npm --version)" >> "$GITHUB_ENV"
      - name: Build production UI
        env:
          LAYERSENTRY_SUPPORT_BUILD: "0"
        run: |
          cd ui
          npm ci --no-audit --no-fund
          git diff --exit-code -- package-lock.json
          npm run lint -- --no-fix
          npm run test:unit
          npm run build
      - name: Build and validate unsigned release contract
        env:
          LAYERSENTRY_BUILDER_ID: github-actions/ubuntu-22.04
          RELEASE_VERSION: ${{ inputs.release_version || format('ci-{0}', github.sha) }}
        run: |
          tools/layersentry-release/build-ui-release.sh \
            --version "$RELEASE_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --output-dir layersentry-release
          python3 tools/layersentry-release/release_contract.py verify \
            --bundle-dir layersentry-release \
            --expected-source-commit "$GITHUB_SHA" \
            --allow-unsigned
      - name: Upload immutable candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-ui-${{ inputs.release_version || 'ci' }}-${{ github.sha }}
          path: layersentry-release/
          if-no-files-found: error
          retention-days: 30
