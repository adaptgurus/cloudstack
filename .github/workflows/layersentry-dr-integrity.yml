name: LayerSentry DR integrity

on:
  pull_request:
    paths:
      - 'tools/layersentry/dr_*.py'
      - 'tools/layersentry/tests/test_dr*.py'
      - 'tools/layersentry/tests/run_dr_integrity.py'
      - '.github/workflows/layersentry-dr-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layersentry-dr-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout exact public native fixture adapter
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: adaptgurus/cozystack
          ref: c8ad45c4dca0755ba3091a4ee3f445e5ba9b8361
          path: .dr-native-fixture
          persist-credentials: false
          sparse-checkout: hack/layersentry
      - name: Install distro QEMU for real offline reconstruction
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-utils
      - name: Run mandatory DR suites with zero skips
        env:
          LAYERSENTRY_NATIVE_ACCEPTANCE_DIR: ${{ github.workspace }}/.dr-native-fixture/hack/layersentry
          LAYERSENTRY_TEST_QEMU_IMG: /usr/bin/qemu-img
          LAYERSENTRY_TEST_QEMU_IO: /usr/bin/qemu-io
        run: |
          python3 tools/layersentry/tests/run_dr_integrity.py --output dr-integrity-result.json
          git diff --exit-code
      - name: Publish source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-dr-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: dr-integrity-result.json
          if-no-files-found: error
          retention-days: 30
