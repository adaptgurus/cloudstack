name: LayerSentry K8s Source Validation

on:
  workflow_dispatch:
  push:
    branches:
      - layersentry/4.22.1.1-ui
    paths:
      - 'tools/layersentry/k8s/**'
      - 'docs/layersentry/evidence/k8s/**'
      - '.github/workflows/layersentry-k8s-*'
      - 'tools/layersentry/governance/module_path_fence.py'
      - 'tools/layersentry/governance/test_module_path_fence.py'
      - 'tools/layersentry/governance/module-writer-guard.sh'
      - 'tools/layersentry/governance/expensive_retry_guard.py'
      - 'tools/layersentry/governance/test_expensive_retry_guard.py'

permissions:
  contents: read

concurrency:
  group: layersentry-k8s-source-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-k8s-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Test governance guards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/layersentry/governance/module_path_fence.py \
            tools/layersentry/governance/expensive_retry_guard.py
          python3 -m unittest \
            tools/layersentry/governance/test_module_path_fence.py \
            tools/layersentry/governance/test_expensive_retry_guard.py
          bash -n tools/layersentry/governance/module-writer-guard.sh

      - name: Enforce K8s file fence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$EVENT_BEFORE"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$base" ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || printf '%040d' 0)"
          fi
          python3 tools/layersentry/governance/module_path_fence.py \
            --module k8s \
            --base "$base" \
            --head "$HEAD_SHA"

      - name: Validate K8s source, manifests and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/layersentry/k8s/validate-source.py

      - name: Prove exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'K8S_SOURCE_GATE_OK source_sha=%s\n' "$GITHUB_SHA"
