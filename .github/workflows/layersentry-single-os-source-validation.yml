name: LayerSentry Single-OS Exact Validation

on:
  workflow_dispatch:
  push:
    branches:
      - layersentry/tmp-single-os-format-20260907
    paths:
      - '.github/workflows/layersentry-single-os-source-validation.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-temp-single-os-validation
  cancel-in-progress: false

jobs:
  validate-shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout temporary controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go 1.23
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.x'
          cache: false

      - name: Install Ansible validation dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends ansible-core >/dev/null
          go version
          python3 --version
          ansible-playbook --version | head -1

      - name: Run exact requested validation matrix on newest shared HEAD
        shell: bash
        run: |
          set -euo pipefail
          shared='layersentry/4.22.1.1-ui'
          out="$RUNNER_TEMP/layersentry-validation"
          mkdir -p "$out/logs" "$out/bin"
          git fetch --no-tags origin "+refs/heads/${shared}:refs/remotes/origin/${shared}"
          git checkout --detach "refs/remotes/origin/${shared}"
          sha="$(git rev-parse HEAD)"
          printf 'source_sha=%s\n' "$sha" | tee "$out/metadata.txt"
          go version | tee -a "$out/metadata.txt"
          python3 --version 2>&1 | tee -a "$out/metadata.txt"
          ansible-playbook --version | head -1 | tee -a "$out/metadata.txt"

          agent="$GITHUB_WORKSPACE/tools/layersentry/single-os/agent"
          overall=0
          gate() {
            name="$1"; shift
            set +e
            "$@" >"$out/logs/${name}.log" 2>&1
            rc=$?
            set -e
            printf '%s=%d\n' "$name" "$rc" | tee -a "$out/status.txt"
            if (( rc != 0 )); then overall=1; fi
          }

          gate gofmt bash -lc 'agent="$1"; mapfile -d "" f < <(find "$agent" -type f -name "*.go" -print0 | sort -z); test ${#f[@]} -gt 0; test -z "$(gofmt -l "${f[@]}")"' _ "$agent"
          gate go_mod_tidy_diff bash -lc 'cd "$1" && go mod tidy -diff' _ "$agent"
          gate go_test bash -lc 'cd "$1" && go test -count=1 ./...' _ "$agent"
          gate go_vet bash -lc 'cd "$1" && go vet ./...' _ "$agent"
          gate build_layersentryd bash -lc 'cd "$1" && go build -o "$2" ./cmd/layersentryd' _ "$agent" "$out/bin/layersentryd"
          gate build_layersentryctl bash -lc 'cd "$1" && go build -o "$2" ./cmd/layersentryctl' _ "$agent" "$out/bin/layersentryctl"
          gate python_compile bash -lc 'python3 -m compileall -q "$1" "$2"' _ "$GITHUB_WORKSPACE/tools/layersentry/single-os" "$GITHUB_WORKSPACE/tools/layersentry/ansible"
          gate ansible_syntax bash -lc 'set -euo pipefail; root="$1"; while IFS= read -r -d "" f; do ansible-playbook -i localhost, --syntax-check "$f"; done < <(find "$root" -type f \( -name "*.yml" -o -name "*.yaml" \) -path "*/playbooks/*" -print0 | sort -z)' _ "$GITHUB_WORKSPACE/tools/layersentry"
          gate shell_syntax bash -lc 'set -euo pipefail; root="$1"; while IFS= read -r -d "" f; do bash -n "$f"; done < <(find "$root" -type f -name "*.sh" -print0 | sort -z)' _ "$GITHUB_WORKSPACE/tools/layersentry"

          printf 'overall=%d\n' "$overall" | tee -a "$out/status.txt"
          cat "$out/status.txt"
          exit "$overall"

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-exact-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/layersentry-validation/
          if-no-files-found: warn
          retention-days: 1
