name: LayerSentry Single-OS Source Validation

on:
  workflow_dispatch:
  push:
    branches:
      - layersentry/4.22.1.1-ui
    paths:
      - 'tools/layersentry/single-os/**'
      - 'tools/layersentry/ansible/**'
      - '.github/workflows/layersentry-single-os-source-validation.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-single-os-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Go 1.23
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: tools/layersentry/single-os/agent/go.sum

      - name: Install Ansible validation dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ansible-core
          ansible-playbook --version
          go version
          python3 --version

      - name: Run Single-OS source validation
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .layersentry-evidence
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'sha=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
          } > .layersentry-evidence/metadata.txt
          tools/layersentry/single-os/validate-source.sh 2>&1 | tee .layersentry-evidence/validation.log

      - name: Record validation conclusion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .layersentry-evidence
          printf 'job_status=%s\n' '${{ job.status }}' >> .layersentry-evidence/metadata.txt

      - name: Upload durable validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentry-single-os-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .layersentry-evidence/
          if-no-files-found: error
          retention-days: 30
